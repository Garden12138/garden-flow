name: Feature request
description: 提议一个可验证的产品改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景遇到什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 描述行为和验收标准，不只描述按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
  - type: textarea
    id: scope
    attributes:
      label: 数据、隐私与网络影响
      description: 是否新增数据、供应商请求、权限、IPC 或文件访问？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
