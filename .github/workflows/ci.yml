name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm run setup

      - name: Check generated brand files
        run: |
          pnpm sync:brand
          git diff --exit-code -- branding desktop/shared/brand.generated.json desktop/src/config/brand.generated.json Plugin/brand.generated.json Plugin/src/brandTheme.generated.js

      - name: Static checks
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Compile renderer and Electron bundles
        run: pnpm --dir desktop exec vite build
